<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Maleeha — AI and Machine Learning">
  <title>Maleeha — AI &amp; Machine Learning</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#22d3ee" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#22d3ee;#a78bfa" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <clipPath id="panel">
      <rect x="0" y="0" width="900" height="220" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .name  { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 52px; letter-spacing: 0.5px; fill: #f1f5f9; }
    .tag   { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 21px; letter-spacing: 2.4px; fill: url(#accent); }
    .mono  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; letter-spacing: 0.6px; fill: #64748b; }

    .rise  { opacity: 0; animation: rise 0.85s cubic-bezier(.22,.75,.2,1) forwards; }
    .d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.38s; } .d3 { animation-delay: 0.60s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .node  { fill: #0f172a; stroke: url(#accent); stroke-width: 1.6; }
    .edge  { stroke: #334155; stroke-width: 1; fill: none; opacity: 0.55; }
    .spark { stroke: url(#accent); stroke-width: 2.2; fill: none; stroke-linecap: round; }

    @media (prefers-reduced-motion: reduce) {
      .rise { opacity: 1; animation: none; }
      .spark { display: none; }
    }
  </style>

  <g clip-path="url(#panel)">
    <rect width="900" height="220" fill="url(#bg)"/>

    <!-- drifting ambient light -->
    <ellipse cx="180" cy="40" rx="260" ry="150" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 60 24; 0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="760" cy="200" rx="240" ry="140" fill="url(#glow2)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; -50 -20; 0 0" dur="19s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ── neural graph ───────────────────────────────── -->
    <g>
      <!-- static edges -->
      <g class="edge">
        <path d="M620 70 L720 50"/><path d="M620 70 L720 90"/><path d="M620 70 L720 130"/><path d="M620 70 L720 170"/>
        <path d="M620 110 L720 50"/><path d="M620 110 L720 90"/><path d="M620 110 L720 130"/><path d="M620 110 L720 170"/>
        <path d="M620 150 L720 50"/><path d="M620 150 L720 90"/><path d="M620 150 L720 130"/><path d="M620 150 L720 170"/>
        <path d="M720 50 L820 90"/><path d="M720 50 L820 130"/>
        <path d="M720 90 L820 90"/><path d="M720 90 L820 130"/>
        <path d="M720 130 L820 90"/><path d="M720 130 L820 130"/>
        <path d="M720 170 L820 90"/><path d="M720 170 L820 130"/>
      </g>

      <!-- travelling signals -->
      <g class="spark" stroke-dasharray="10 150">
        <path d="M620 110 L720 90">
          <animate attributeName="stroke-dashoffset" from="160" to="0" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <path d="M620 150 L720 50">
          <animate attributeName="stroke-dashoffset" from="160" to="0" dur="2.4s" begin="0.35s" repeatCount="indefinite"/>
        </path>
        <path d="M620 70 L720 130">
          <animate attributeName="stroke-dashoffset" from="160" to="0" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
        </path>
        <path d="M620 110 L720 170">
          <animate attributeName="stroke-dashoffset" from="160" to="0" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
        </path>
        <path d="M720 90 L820 90">
          <animate attributeName="stroke-dashoffset" from="160" to="0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
        </path>
        <path d="M720 130 L820 130">
          <animate attributeName="stroke-dashoffset" from="160" to="0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        </path>
        <path d="M720 50 L820 90">
          <animate attributeName="stroke-dashoffset" from="160" to="0" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- nodes -->
      <g class="node">
        <circle cx="620" cy="70"  r="6"><animate attributeName="r" values="6;7.6;6" dur="3.2s" repeatCount="indefinite"/></circle>
        <circle cx="620" cy="110" r="6"><animate attributeName="r" values="6;7.6;6" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></circle>
        <circle cx="620" cy="150" r="6"><animate attributeName="r" values="6;7.6;6" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
        <circle cx="720" cy="50"  r="6"><animate attributeName="r" values="6;7.6;6" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="720" cy="90"  r="6"><animate attributeName="r" values="6;7.6;6" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
        <circle cx="720" cy="130" r="6"><animate attributeName="r" values="6;7.6;6" dur="3.2s" begin="2.0s" repeatCount="indefinite"/></circle>
        <circle cx="720" cy="170" r="6"><animate attributeName="r" values="6;7.6;6" dur="3.2s" begin="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="820" cy="90"  r="7"><animate attributeName="r" values="7;8.8;7" dur="3.2s" begin="2.8s" repeatCount="indefinite"/></circle>
        <circle cx="820" cy="130" r="7"><animate attributeName="r" values="7;8.8;7" dur="3.2s" begin="3.0s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- ── type ───────────────────────────────────────── -->
    <text class="name rise d1" x="56" y="92">Maleeha</text>

    <path d="M56 110 L214 110" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="158" stroke-dashoffset="158">
      <animate attributeName="stroke-dashoffset" from="158" to="0" dur="1.1s" begin="0.45s"
               fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.2 1"/>
    </path>

    <text class="tag rise d2" x="56" y="142">AI &amp; MACHINE LEARNING</text>
    <text class="mono rise d3" x="57" y="172">@Maleehakk  ·  notes, models &amp; experiments</text>

    <rect x="0.5" y="0.5" width="899" height="219" rx="16" fill="none" stroke="#1e293b" stroke-width="1"/>
  </g>
</svg>
